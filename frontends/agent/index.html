<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Agentes · PQRS SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@9.0.19/dist/browser/signalr.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- ===== VISTA LOGIN ===== -->
    <section id="login-view" data-section class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto bg-gray-800 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-headset text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 mt-3">PQRS SaaS</h1>
                <p class="text-sm text-gray-500 mt-1">Panel de gestión de agentes</p>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 shadow-md p-6">
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Slug del tenant</label>
                        <input id="slug" type="text" required autocomplete="off"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none"
                            placeholder="empresa_demo">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                        <input id="email" type="email" required autocomplete="username"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none"
                            placeholder="admin@empresa.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña</label>
                        <input id="password" type="password" required autocomplete="current-password"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none"
                            placeholder="••••••••">
                    </div>
                    <button id="login-btn" type="submit"
                        class="w-full bg-gray-800 text-white py-2 rounded-lg text-sm font-semibold hover:bg-gray-900 transition">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== VISTA APP ===== -->
    <section id="app-view" data-section class="hidden">
        <div class="flex min-h-screen">

            <!-- Sidebar -->
            <aside id="sidebar"
                class="fixed md:sticky top-0 left-0 z-30 h-screen w-64 bg-gray-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200">
                <div class="flex items-center justify-between px-5 h-16 border-b border-gray-700">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-headset text-2xl text-white"></i>
                        <div>
                            <div class="font-bold text-white leading-none">PQRS SaaS</div>
                            <div class="text-[11px] text-gray-400" id="user-role">—</div>
                        </div>
                    </div>
                    <button id="sidebar-close" class="md:hidden text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
                </div>

                <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-sm">
                    <a href="#" data-nav="tickets" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-ticket-alt w-5 text-center"></i> Tickets</a>
                    <a href="#" data-nav="kb" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-book w-5 text-center"></i> Base de conocimiento</a>
                    <a href="#" data-nav="agents" id="nav-agents" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-users w-5 text-center"></i> Agentes</a>
                    <a href="#" id="nav-config" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-cog w-5 text-center"></i> Configuración</a>
                </nav>

                <div class="p-3 border-t border-gray-700">
                    <a href="#" id="logout-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white transition">
                        <i class="fas fa-sign-out-alt w-5 text-center"></i> Cerrar sesión</a>
                </div>
            </aside>

            <!-- Contenido -->
            <div class="flex-1 flex flex-col min-w-0">
                <header class="sticky top-0 z-20 flex items-center justify-between px-4 h-16 bg-white border-b border-slate-200">
                    <div class="flex items-center gap-3">
                        <button id="menu-toggle" class="md:hidden text-gray-500 hover:text-gray-700">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                        <h1 id="app-title" class="text-lg font-bold text-gray-900">Tickets PQRS</h1>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="rt-status" class="w-3 h-3 rounded-full bg-gray-300" title="Tiempo real"></span>
                        <a href="#" id="logout-btn-mobile" class="md:hidden text-gray-500 hover:text-rose-600">
                            <i class="fas fa-sign-out-alt text-xl"></i>
                        </a>
                    </div>
                </header>

                <main id="app-content" class="flex-1 p-4 md:p-6 overflow-y-auto">
                    <!-- Renderizado dinámico -->
                </main>
            </div>
        </div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
