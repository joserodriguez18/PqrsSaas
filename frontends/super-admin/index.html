<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Administración · PQRS SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- ===== VISTA LOGIN ===== -->
    <section id="login-view" data-section class="min-h-screen flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <span class="material-symbols-outlined text-5xl text-indigo-600">admin_panel_settings</span>
                <h1 class="text-2xl font-bold text-slate-900 mt-2">PQRS SaaS</h1>
                <p class="text-sm text-slate-500 mt-1">Panel de super administrador</p>
            </div>
            <div class="bg-white rounded-xl border border-slate-200 shadow-md p-6">
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                        <input id="email" type="email" required autocomplete="username"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none"
                            placeholder="superadmin@pqrs.local">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
                        <input id="password" type="password" required autocomplete="current-password"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none"
                            placeholder="••••••••">
                    </div>
                    <button id="login-btn" type="submit"
                        class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== VISTA APP ===== -->
    <section id="app-view" data-section class="hidden">
        <div class="flex min-h-screen">

            <!-- Sidebar -->
            <aside id="sidebar"
                class="fixed md:sticky top-0 left-0 z-30 h-screen w-64 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200">
                <div class="flex items-center justify-between px-5 h-16 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-3xl text-indigo-600">hub</span>
                        <div>
                            <div class="font-bold text-indigo-700 leading-none">AdminConsole</div>
                            <div class="text-[11px] text-slate-400">Multi-tenant SaaS</div>
                        </div>
                    </div>
                    <button id="sidebar-close" class="md:hidden text-slate-400 hover:text-slate-600"><span class="material-symbols-outlined">close</span></button>
                </div>

                <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
                    <a href="#" data-nav="panel" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">
                        <span class="material-symbols-outlined text-[20px]">dashboard</span> Panel</a>
                    <a href="#" data-nav="tenants" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">
                        <span class="material-symbols-outlined text-[20px]">domain</span> Tenants</a>
                    <a href="#" data-nav="superadmins" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">
                        <span class="material-symbols-outlined text-[20px]">admin_panel_settings</span> Superadmins</a>
                    <a href="#" id="nav-config" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">
                        <span class="material-symbols-outlined text-[20px]">settings</span> Configuración</a>
                </nav>

                <div class="p-3 border-t border-slate-100">
                    <a href="#" id="logout-btn" class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-rose-50 hover:text-rose-600 transition">
                        <span class="material-symbols-outlined text-[20px]">logout</span> Cerrar sesión</a>
                </div>
            </aside>

            <!-- Contenido -->
            <div class="flex-1 flex flex-col min-w-0">
                <header class="sticky top-0 z-20 flex items-center justify-between px-4 h-16 bg-white border-b border-slate-200">
                    <div class="flex items-center gap-3">
                        <button id="menu-toggle" class="md:hidden text-slate-500 hover:text-slate-700">
                            <span class="material-symbols-outlined">menu</span>
                        </button>
                        <h1 id="app-title" class="text-lg font-bold text-slate-900">Panel de control</h1>
                    </div>
                    <a href="#" id="logout-btn-mobile" class="md:hidden text-slate-500 hover:text-rose-600">
                        <span class="material-symbols-outlined">logout</span>
                    </a>
                </header>

                <main id="app-content" class="flex-1 p-4 md:p-6 overflow-y-auto">
                    <!-- Renderizado dinámico -->
                </main>
            </div>
        </div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>
</html>
