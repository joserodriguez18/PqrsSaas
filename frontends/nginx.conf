server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip de estáticos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # API: reverse proxy al contenedor api
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Deja listo WebSockets/SignalR a futuro
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Swagger / directo a la API si se accede por /api/... (ya cubierto arriba)

    # Dashboard de superadmin
    location /superadmin/ {
        alias /usr/share/nginx/html/superadmin/;
        try_files $uri $uri/ /superadmin/index.html;
    }

    # Widget (futuro)
    location /widget/ {
        alias /usr/share/nginx/html/widget/;
    }

    # Landing
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
